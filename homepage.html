<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission and Course Recommendation</title>
    <link rel="stylesheet" href="style-homepage.css">
</head>
<body>
    <h1>Student Admission and Course Recommendation</h1>
    <form id="admission-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br>

        <label for="previous_school">Previous School:</label>
        <input type="text" id="previous_school" name="previous_school" required><br>

        <label for="sase_score">SASE Score:</label>
        <input type="number" id="sase_score" name="sase_score" required><br>

        <button type="submit">Submit</button>
    </form>

    <div id="recommendations">
        <h2>Recommended Courses</h2>
        <ul id="course-list"></ul>
    </div>

    <script src="script-homepage.js"></script>
</body>
</html>
